<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LACASA POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      
      body { font-family: 'Inter', sans-serif; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* --- THERMAL PRINTER STYLES --- */
      @media screen {
        .print-only { display: none !important; }
      }

      @media print {
        @page { margin: 0; size: 80mm auto; }
        body * { visibility: hidden; }
        #root, body, html { overflow: visible !important; height: auto !important; background: white; }
        .print-only, .print-only * { visibility: visible !important; }
        /* The Stem */
        .receipt-stem-container {
          border-left: 2px dashed black; /* This is the stem */
          margin-left: 8px;
          padding-left: 12px;
          position: relative;
        }

        /* The Flower Head */
        .flower-head-main {
          font-size: 30px;
          margin-left: -6px; /* Centers head over the stem line */
          line-height: 1;
        }

        /* Small leaves that appear on the stem */
        .stem-leaf {
            font-size: 14px;
            margin-left: -20px;
            position: absolute;
        }
        .print-only { 
            position: absolute; 
            left: 0; 
            top: 0; 
            width: 72mm; 
            height:auto !important;
            padding: 2px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: black;
            display: block !important;
            overflow: hidden; 
          
        .no-print { display: none !important; }
        .receipt-line { display: flex; justify-content: space-between; width:100%; margin-bottom: 2px; }
        .receipt-divider { border-bottom: 1px dashed black; margin: 5px 0; }
        .receipt-header { text-align: center; margin-bottom: 10px; }
        .receipt-bold { font-weight: bold; }
        .receipt-large { font-size: 16px; font-weight: bold; }
      }
      }
    </style>
    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
        "recharts": "https://esm.sh/recharts@2.12.2?external=react,react-dom",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      }
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased overflow-hidden">
    <div id="root" class="h-screen w-screen flex flex-col"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useContext, createContext, useMemo, useRef } from 'react';
      import ReactDOM from 'react-dom/client';
      import { 
        LayoutDashboard, ShoppingCart, Package, Coins, 
        Plus, Minus, Ticket, X, Search, CheckCircle,
        Edit2, Trash2, Save, PackageOpen, Layers,
        DollarSign, ShoppingBag, Star, ClipboardList, ListChecks, 
        AlertTriangle, Tag, Printer, FileText, User, Link as LinkIcon, 
        MinusCircle, Menu, LogOut, Loader2, Grid3X3, Split, Scissors, Armchair, Settings, RefreshCw, AlertCircle
      } from 'lucide-react';
      import { 
        BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer 
      } from 'recharts';

      import { initializeApp } from "firebase/app";
      import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";
      import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, getDocs, writeBatch, setDoc, getDoc } from "firebase/firestore";

      const firebaseConfig = {
        apiKey: "AIzaSyDU9-o2lNfM0h1EZHjh2cZxluSddoP980Q",
        authDomain: "lacasa-ddc80.firebaseapp.com",
        projectId: "lacasa-ddc80",
        storageBucket: "lacasa-ddc80.firebasestorage.app",
        messagingSenderId: "162103724482",
        appId: "1:162103724482:web:55709c250858d273dd6e5b"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const EXCHANGE_RATE = 90000;

      const LoginPage = () => {
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [error, setError] = useState('');
        const [loading, setLoading] = useState(false);
        const handleAuth = async (e) => {
          e.preventDefault(); setError(''); setLoading(true);
          try { await signInWithEmailAndPassword(auth, email, password); } 
          catch (err) { setError("Invalid email or password."); } 
          finally { setLoading(false); }
        };
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
            <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
              <div className="flex justify-center mb-6"><div className="w-16 h-16 bg-emerald-600 rounded-2xl flex items-center justify-center text-white font-bold text-3xl shadow-emerald-200 shadow-lg">L</div></div>
              <h2 className="text-2xl font-bold text-center text-slate-800 mb-2">LACASA POS</h2>
              <form onSubmit={handleAuth} className="space-y-4">
                <div><label className="block text-sm font-medium text-slate-700 mb-1">Email</label><input type="email" required className="w-full px-4 py-2 border rounded-lg" value={email} onChange={e => setEmail(e.target.value)} /></div>
                <div><label className="block text-sm font-medium text-slate-700 mb-1">Password</label><input type="password" required className="w-full px-4 py-2 border rounded-lg" value={password} onChange={e => setPassword(e.target.value)} /></div>
                {error && <div className="text-red-500 text-sm">{error}</div>}
                <button type="submit" disabled={loading} className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl">{loading ? '...' : 'Sign In'}</button>
              </form>
            </div>
          </div>
        );
      };

      const DataContext = createContext(undefined);
      const DataProvider = ({ children }) => {
        const [user, setUser] = useState(null);
        const [authLoading, setAuthLoading] = useState(true);
        const [currency, setCurrency] = useState('LBP');
        const [menuItems, setMenuItems] = useState([]);
        const [stockItems, setStockItems] = useState([]);
        const [tickets, setTickets] = useState([]);
        const [salesHistory, setSalesHistory] = useState([]);
        const [categories, setCategories] = useState([]);
        const [groups, setGroups] = useState([]);
        const [tableConfig, setTableConfig] = useState({ floor1: 10, floor2: 6 });

        useEffect(() => {
          const unsubscribe = onAuthStateChanged(auth, (currentUser) => { setUser(currentUser); setAuthLoading(false); });
          return () => unsubscribe();
        }, []);

        useEffect(() => {
          if (!user) return;
          const menuRef = collection(db, 'menuItems');
          const stockRef = collection(db, 'stockItems');
          const salesRef = collection(db, 'sales');
          const ticketsRef = collection(db, 'tickets');
          const catsRef = collection(db, 'categories');
          const groupsRef = collection(db, 'groups');
          const configRef = doc(db, 'settings', 'tables');
          const unsubMenu = onSnapshot(menuRef, (snap) => setMenuItems(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
          const unsubStock = onSnapshot(stockRef, (snap) => setStockItems(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
          const unsubSales = onSnapshot(query(salesRef, orderBy('timestamp', 'desc')), (snap) => setSalesHistory(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
          const unsubTickets = onSnapshot(query(ticketsRef, orderBy('createdAt', 'asc')), (snap) => setTickets(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
          const unsubCats = onSnapshot(query(catsRef, orderBy('name')), (snap) => setCategories(snap.docs.map(d => d.data().name)));
          const unsubGroups = onSnapshot(query(groupsRef, orderBy('name')), (snap) => setGroups(snap.docs.map(d => d.data().name)));
          const unsubConfig = onSnapshot(configRef, (docSnap) => { if(docSnap.exists()) setTableConfig(docSnap.data()); else setDoc(configRef, { floor1: 10, floor2: 6 }); });
          return () => { unsubMenu(); unsubStock(); unsubSales(); unsubTickets(); unsubCats(); unsubGroups(); unsubConfig(); };
        }, [user]);

        const toggleCurrency = () => setCurrency(prev => prev === 'USD' ? 'LBP' : 'USD');
        const simpleConvert = (amount) => currency === 'USD' ? amount : amount * EXCHANGE_RATE;
        const formatPrice = (amount) => currency === 'USD' ? `$${amount.toFixed(2)}` : `${(amount * EXCHANGE_RATE).toLocaleString()} L.L`;
        const logout = () => signOut(auth);

        const addStockItem = async (item) => await addDoc(collection(db, 'stockItems'), item);
        const updateStockItem = async (item) => await updateDoc(doc(db, 'stockItems', item.id), item);
        const deleteStockItem = async (id) => await deleteDoc(doc(db, 'stockItems', id));
        const addMenuItem = async (item) => await addDoc(collection(db, 'menuItems'), item);
        const updateMenuItem = async (item) => await updateDoc(doc(db, 'menuItems', item.id), item);
        const deleteMenuItem = async (id) => await deleteDoc(doc(db, 'menuItems', id));
        const addCategory = async (name) => { if(!categories.includes(name)) await addDoc(collection(db, 'categories'), { name }); };
        const deleteCategory = async (name) => { const snap = await getDocs(query(collection(db, 'categories'))); const d = snap.docs.find(doc => doc.data().name === name); if(d) await deleteDoc(d.ref); };
        const addGroup = async (name) => { if(!groups.includes(name)) await addDoc(collection(db, 'groups'), { name }); };
        const deleteGroup = async (name) => { const snap = await getDocs(query(collection(db, 'groups'))); const d = snap.docs.find(doc => doc.data().name === name); if(d) await deleteDoc(d.ref); };
        const updateTableConfig = async (newConfig) => await setDoc(doc(db, 'settings', 'tables'), newConfig);

        const createTicket = async (tableId, customerName = '') => {
            const existing = tickets.find(t => t.tableId === tableId);
            if(existing) return existing.id;
            const docRef = await addDoc(collection(db, 'tickets'), { name: `Table ${tableId}`, tableId, items: [], status: 'open', createdAt: Date.now(), customerName, note: '' });
            return docRef.id;
        };

        const updateTicketItems = async (ticketId, items) => await updateDoc(doc(db, 'tickets', ticketId), { items });
        const updateTicketDetails = async (ticketId, updates) => await updateDoc(doc(db, 'tickets', ticketId), updates);
        const deleteTicket = async (ticketId) => await deleteDoc(doc(db, 'tickets', ticketId));

        const completeTicket = async (ticketId, itemsToPay = null) => {
           const ticket = tickets.find(t => t.id === ticketId);
           if (!ticket) return;
           let payingItems = [];
           let remainingItems = [];
           if(itemsToPay) {
               ticket.items.forEach((item, index) => { if(itemsToPay.includes(index)) payingItems.push(item); else remainingItems.push(item); });
           } else { payingItems = ticket.items; }
           if (payingItems.length === 0) return;
           const total = payingItems.reduce((sum, item) => {
              const itemTotal = item.price * item.quantity;
              const modsTotal = (item.selectedModifiers || []).reduce((mSum, mod) => mSum + (mod.price * item.quantity), 0);
              return sum + itemTotal + modsTotal;
           }, 0);
           const batch = writeBatch(db);
           const deductions = {}; 
           payingItems.forEach(ticketItem => {
              const menuItem = menuItems.find(m => m.id === ticketItem.id);
              if (menuItem && menuItem.recipe) {
                 menuItem.recipe.forEach(ingredient => { deductions[ingredient.itemId] = (deductions[ingredient.itemId] || 0) + (ingredient.quantity * ticketItem.quantity); });
              }
           });
           stockItems.forEach(sItem => { if (deductions[sItem.id]) { const newStock = Math.max(0, (sItem.stock || 0) - deductions[sItem.id]); batch.update(doc(db, 'stockItems', sItem.id), { stock: newStock }); } });
           const saleRef = doc(collection(db, 'sales'));
           batch.set(saleRef, { ticketName: ticket.name, tableId: ticket.tableId, items: payingItems, total, timestamp: Date.now(), paymentMethod: 'cash', customerName: ticket.customerName, isPartial: !!itemsToPay });
           if (remainingItems.length > 0) batch.update(doc(db, 'tickets', ticketId), { items: remainingItems });
           else batch.delete(doc(db, 'tickets', ticketId));
           await batch.commit();
        };

        if (authLoading) return <div className="h-screen w-screen flex items-center justify-center text-emerald-600"><Loader2 className="animate-spin w-10 h-10"/></div>;
        return (
          <DataContext.Provider value={{
            user, logout, menuItems, stockItems, tickets, salesHistory, currency, categories, groups, tableConfig,
            toggleCurrency, formatPrice, convertPrice: simpleConvert,
            addMenuItem, updateMenuItem, deleteMenuItem, addStockItem, updateStockItem, deleteStockItem,
            addCategory, deleteCategory, addGroup, deleteGroup, updateTableConfig,
            createTicket, updateTicketItems, updateTicketDetails, deleteTicket, completeTicket
          }}>{children}</DataContext.Provider>
        );
      };

      const useData = () => { const context = useContext(DataContext); if (!context) throw new Error('useData must be used within DataProvider'); return context; };

      const Sidebar = ({ currentView, setCurrentView, isMobileMenuOpen, setIsMobileMenuOpen }) => {
        const { currency, toggleCurrency, logout } = useData();
        const NavItem = ({ view, icon: Icon, label }) => (
          <button onClick={() => { setCurrentView(view); setIsMobileMenuOpen(false); }} className={`flex items-center justify-center lg:justify-start gap-3 px-3 lg:px-4 py-3 rounded-xl transition-all w-full ${currentView === view ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-200' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-700'}`}>
            <Icon size={24} strokeWidth={2.5} className="shrink-0" />
            <span className="hidden lg:block font-medium whitespace-nowrap">{label}</span>
          </button>
        );
        return (
          <>
            <aside className="no-print hidden md:flex flex-col md:w-20 lg:w-64 bg-white border-r border-slate-200 h-full z-20">
              <div className="h-20 flex items-center justify-center lg:justify-start lg:px-6 border-b">
                <div className="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white font-bold text-lg">L</div>
                <h1 className="hidden lg:block ml-3 text-xl font-bold text-slate-800">LACASA</h1>
              </div>
              <nav className="space-y-2 flex-1 px-2 lg:px-4 py-6">
                <NavItem view="tables" icon={Armchair} label="Tables" />
                <NavItem view="pos" icon={ShoppingCart} label="Active Order" />
                <NavItem view="sales" icon={LayoutDashboard} label="Sales" />
                <NavItem view="stock" icon={ClipboardList} label="Stock" />
                <NavItem view="inventory" icon={Package} label="Menu" />
              </nav>
              <div className="p-4 border-t space-y-2">
                <button onClick={toggleCurrency} className="flex items-center justify-center lg:justify-between w-full p-2 rounded-xl bg-slate-100 text-slate-700">
                  <div className="flex items-center gap-2"><Coins size={20} /><span className="hidden lg:block text-sm">Currency</span></div>
                  <span className="hidden lg:block font-bold text-xs bg-white px-2 py-1 rounded border">{currency}</span>
                </button>
                <button onClick={logout} className="flex items-center justify-center lg:justify-start gap-3 w-full p-2 text-red-500 hover:bg-red-50">
                  <LogOut size={20} /><span className="hidden lg:block text-sm">Log Out</span>
                </button>
              </div>
            </aside>
            <div className="no-print md:hidden fixed top-0 left-0 right-0 h-16 bg-white border-b flex items-center justify-between px-4 z-50">
              <div className="flex items-center gap-2"><div className="w-8 h-8 bg-emerald-600 rounded-lg flex items-center justify-center text-white font-bold">L</div><span className="font-bold text-lg">LACASA</span></div>
              <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 text-slate-600"><Menu /></button>
            </div>
            {isMobileMenuOpen && (
              <div className="fixed inset-0 bg-black/50 z-40 md:hidden" onClick={() => setIsMobileMenuOpen(false)}>
                <div className="absolute right-0 top-0 bottom-0 w-64 bg-white p-4 shadow-xl flex flex-col" onClick={e => e.stopPropagation()}>
                   <nav className="space-y-2 flex-1 pt-12">
                    <NavItem view="tables" icon={Armchair} label="Tables" />
                    <NavItem view="pos" icon={ShoppingCart} label="Active Order" />
                    <NavItem view="sales" icon={LayoutDashboard} label="Sales" />
                    <NavItem view="stock" icon={ClipboardList} label="Stock" />
                    <NavItem view="inventory" icon={Package} label="Menu" />
                  </nav>
                </div>
              </div>
            )}
          </>
        );
      };

      const TablesPage = ({ setActiveTicketId, setCurrentView }) => {
          const { tickets, createTicket, formatPrice, tableConfig, updateTableConfig } = useData();
          const [filter, setFilter] = useState('all');
          const [isConfigOpen, setIsConfigOpen] = useState(false);
          const [localConfig, setLocalConfig] = useState(tableConfig);
          useEffect(() => setLocalConfig(tableConfig), [tableConfig]);
          const handleTableClick = async (tableId) => { const tId = await createTicket(tableId); setActiveTicketId(tId); setCurrentView('pos'); };
          const saveConfig = () => { updateTableConfig({ floor1: parseInt(localConfig.floor1) || 10, floor2: parseInt(localConfig.floor2) || 6 }); setIsConfigOpen(false); };
          const renderTable = (id) => {
              const ticket = tickets.find(t => t.tableId === id);
              const isOccupied = !!ticket;
              if (filter === 'available' && isOccupied) return null; if (filter === 'occupied' && !isOccupied) return null;
              return (
                  <button key={id} onClick={() => handleTableClick(id)} className={`h-28 rounded-2xl border-2 flex flex-col items-center justify-center relative transition-all shadow-sm hover:shadow-md ${isOccupied ? 'bg-red-50 border-red-300 text-red-800' : 'bg-white border-slate-200 text-slate-500 hover:border-emerald-300'}`}>
                      <span className="text-2xl font-bold mb-1">T{id}</span>
                      {isOccupied ? <div className="text-xs font-semibold bg-red-100 px-2 py-1 rounded-full flex flex-col items-center"><span>Occupied</span><span className="mt-1">{formatPrice(ticket.items.reduce((s,i) => s + i.price * i.quantity, 0))}</span></div> : <span className="text-xs text-emerald-600 font-medium">Available</span>}
                  </button>
              );
          };
          const floor1Count = tableConfig.floor1 || 10; const floor2Count = tableConfig.floor2 || 6;
          return (
              <div className="h-full p-6 bg-slate-50 overflow-y-auto no-scrollbar">
                  <div className="flex justify-between items-center mb-6">
                      <div className="flex items-center gap-4"><h1 className="text-2xl font-bold flex items-center gap-2"><Armchair /> Tables</h1><div className="flex bg-white rounded-lg p-1 border border-slate-200"><button onClick={() => setFilter('all')} className={`px-3 py-1 rounded text-sm ${filter === 'all' ? 'bg-slate-800 text-white' : 'text-slate-500'}`}>All</button><button onClick={() => setFilter('available')} className={`px-3 py-1 rounded text-sm ${filter === 'available' ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}>Available</button><button onClick={() => setFilter('occupied')} className={`px-3 py-1 rounded text-sm ${filter === 'occupied' ? 'bg-red-600 text-white' : 'text-slate-500'}`}>Occupied</button></div></div>
                      <button onClick={() => setIsConfigOpen(true)} className="flex items-center gap-2 text-slate-500 hover:text-emerald-600 px-3 py-2 bg-white border rounded-lg"><Settings size={18}/> Layout</button>
                  </div>
                  <div className="mb-8"><h2 className="text-lg font-bold text-slate-700 mb-4 border-b pb-2">Floor 1</h2><div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-4">{Array.from({length: floor1Count}, (_, i) => i + 1).map(id => renderTable(id))}</div></div>
                  <div><h2 className="text-lg font-bold text-slate-700 mb-4 border-b pb-2">Floor 2</h2><div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-4">{Array.from({length: floor2Count}, (_, i) => i + 1 + floor1Count).map(id => renderTable(id))}</div></div>
                  {isConfigOpen && (<div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div className="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl"><div className="flex justify-between items-center mb-4"><h3 className="font-bold text-lg">Layout Settings</h3><button onClick={() => setIsConfigOpen(false)}><X size={20}/></button></div><div className="space-y-4"><div><label className="block text-sm font-medium mb-1">Tables Floor 1</label><input type="number" className="w-full border p-2 rounded-lg" value={localConfig.floor1} onChange={e => setLocalConfig({...localConfig, floor1: e.target.value})} /></div><div><label className="block text-sm font-medium mb-1">Tables Floor 2</label><input type="number" className="w-full border p-2 rounded-lg" value={localConfig.floor2} onChange={e => setLocalConfig({...localConfig, floor2: e.target.value})} /></div><button onClick={saveConfig} className="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold">Save</button></div></div></div>)}
              </div>
          );
      };

      const POSPage = ({ activeTicketId, setActiveTicketId, setCurrentView }) => {
        const { menuItems, tickets, updateTicketItems, completeTicket, formatPrice, categories: contextCategories, updateTicketDetails } = useData();
        const [searchTerm, setSearchTerm] = useState(''); 
        const [selectedCategory, setSelectedCategory] = useState('All'); 
        const [selectedGroup, setSelectedGroup] = useState('All'); 
        const [showNote, setShowNote] = useState(false); 
        const [modModalItem, setModModalItem] = useState(null); 
        const [selectedMods, setSelectedMods] = useState([]); 
        const [splitMode, setSplitMode] = useState(false); 
        const [selectedSplitIndices, setSelectedSplitIndices] = useState([]);
        const [printMode, setPrintMode] = useState('receipt'); 

        const activeTicket = tickets.find(t => t.id === activeTicketId);
        
        if (!activeTicket) return (
          <div className="h-full flex flex-col items-center justify-center bg-slate-50 text-slate-400">
            <Armchair size={64} className="mb-4 opacity-50"/><h2 className="text-2xl font-bold">No Active Table</h2>
            <button onClick={() => setCurrentView('tables')} className="px-6 py-3 mt-4 bg-emerald-600 text-white rounded-xl font-bold">Go to Tables</button>
          </div>
        );

        const categories = useMemo(() => ['All', ...contextCategories], [contextCategories]);
        const availableGroups = useMemo(() => { if (selectedCategory === 'All') return []; const groups = new Set(); menuItems.forEach(item => { if (item.category === selectedCategory && item.group) groups.add(item.group); }); return ['All', ...Array.from(groups).sort()]; }, [menuItems, selectedCategory]);
        const filteredInventory = useMemo(() => menuItems.filter(item => { const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase()); const matchesCategory = selectedCategory === 'All' || item.category === selectedCategory; const matchesGroup = selectedGroup === 'All' || !availableGroups.length || item.group === selectedGroup; return matchesSearch && matchesCategory && matchesGroup; }), [menuItems, searchTerm, selectedCategory, selectedGroup, availableGroups]);

        const handleItemClick = (item) => { if(item.modifiers && item.modifiers.length > 0) { setModModalItem(item); setSelectedMods([]); } else { addItemToTicket(item, []); } };

        const addItemToTicket = (item, mods) => { 
          const existingItemIndex = activeTicket.items.findIndex(existing => {
            return existing.id === item.id && JSON.stringify(existing.selectedModifiers || []) === JSON.stringify(mods || []);
          });
          if (existingItemIndex > -1) {
            const updatedItems = [...activeTicket.items];
            updatedItems[existingItemIndex].quantity += 1;
            updateTicketItems(activeTicket.id, updatedItems);
          } else {

                 </div>

               <div className="p-2 border-b bg-slate-50 flex gap-2"><div className="flex-1 bg-white border rounded-md flex items-center px-2"><User size={14} className="mr-2"/><input className="w-full py-2 text-sm outline-none" placeholder="Name" value={activeTicket.customerName || ''} onChange={e => updateTicketDetails(activeTicket.id, { customerName: e.target.value })}/></div><button onClick={() => setSplitMode(!splitMode)} className={`p-2 border rounded-md ${splitMode ? 'bg-amber-100' : 'bg-white'}`}><Scissors size={18}/></button></div>
               
               <div className="flex-1 overflow-y-auto p-2 space-y-2 no-scrollbar">
                 {activeTicket.items.map((item, idx) => (
                   <div key={item.ticketItemId || idx} onClick={() => splitMode && toggleSplitItem(idx)} className={`p-3 rounded-xl border ${splitMode && selectedSplitIndices.includes(idx) ? 'bg-emerald-50 border-emerald-500' : 'bg-white border-slate-100'}`}>
                     <div className="flex justify-between items-start">
                       <div className="flex-1">
                         <div className="font-bold text-slate-800 text-sm">{item.name}</div>
                         <div className="text-xs text-slate-500">{formatPrice(item.price)}</div>
                         {item.selectedModifiers && item.selectedModifiers.map((m, mi) => (<div key={mi} className="text-[10px] text-slate-500">+ {m.name}</div>))}
                       </div>
                       {!splitMode && (
                         <div className="flex items-center gap-2">
                           <button onClick={(e) => {e.stopPropagation(); handleUpdateQuantity(item.ticketItemId, -1)}} className="w-6 h-6 bg-slate-100 rounded"><Minus size={12}/></button>
                           <span className="text-sm font-bold w-4 text-center">{item.quantity}</span>

                         </div>
                       )}
                     </div>
                   </div>
                 ))}
               </div>

               <div className="p-4 bg-white border-t">
                 <div className="flex justify-between text-xl font-extrabold text-slate-900 mb-4"><span>{splitMode ? 'Split' : 'Total'}</span><span className="text-emerald-600">{formatPrice(splitMode ? splitTotal : activeTotal)}</span></div>
                 <div className="grid grid-cols-4 gap-2">
                   <button onClick={() => setShowNote(!showNote)} className="p-3 border rounded-xl"><FileText/></button>
                   <button onClick={handleKitchenPrint} className="p-3 border rounded-xl text-blue-600"><Printer/></button>
                   <button onClick={handlePayAndPrint} className="col-span-2 bg-emerald-600 text-white rounded-xl font-bold">Pay Full</button>
                 </div>
                 {showNote && <textarea className="w-full mt-3 p-2 border rounded-lg text-sm resize-none" rows="2" placeholder="Kitchen Note..." value={activeTicket.note || ''} onChange={e => updateTicketDetails(activeTicket.id, { note: e.target.value })} />}
               </div>
            </div>

              {/* --- HIDDEN PRINT AREA --- */}
            <div id="printable-receipt" className="print-only">
              {printMode === 'kitchen' ? (

                <div>
                  <div className="receipt-header">
                    <div className="receipt-large">KITCHEN ORDER</div>
                    <div className="receipt-bold" style={{fontSize: '26px', margin: '5px 0'}}>TABLE: {activeTicket.name.replace('Table ', '')}</div>
                    <div className="receipt-divider"></div>
                  </div>
                  <div className="receipt-line">
                    <span>Date: {new Date().toLocaleDateString()}</span>
                    <span>Time: {new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>

                  <div className="receipt-divider"></div>
                  {activeTicket.items
                    .filter(item =>

                      <div className="receipt-bold" style={{fontSize: '18px'}}>KITCHEN NOTE:</div>

                      <div style={{fontSize: '12px', letterSpacing: '2px'}}>LOUNGE & CAFE</div>
                    </div>

                    <div className="receipt-line" style={{fontSize: '10px'}}>
                      <span>Date: {new Date().toLocaleDateString()}</span>
                      <span>Time: {new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                    </div>
                    <div className="receipt-line" style={{fontSize: '10px', marginBottom: '10px'}}>
                      <span>Table: {activeTicket.name.replace('Table ', '')}</span>
                      <span>ID: {activeTicket.id.slice(-4)}</span>
                    </div>

                    <div className="receipt-divider"></div>

                    {/* Order Items */}
                    {activeTicket.items.map((item, i) => (
                      <div key={i} style={{marginBottom: '8px', position: 'relative'}}>
                        {/* Add a leaf every 3rd item */}
                        {i % 3 === 0 && <span className="stem-leaf">🍃</span>}
                        
                        <div className="receipt-line">
                          <span style={{fontWeight: 'bold'}}>{item.quantity} x {item.name}</span>

                  <div className="receipt-divider"></div>

      const SalesPage = () => {
        const { salesHistory, formatPrice, convertPrice } = useData();
        const [timeframe, setTimeframe] = useState('daily');

        const filteredSales = useMemo(() => { 
          const now = new Date(); 
          return salesHistory.filter(sale => { 
            const date = new Date(sale.timestamp); 
            if (timeframe === 'daily') return date.toDateString() === now.toDateString(); 
            if (timeframe === 'weekly') { 
              const day = now.getDay(); 
              const diff = now.getDate() - day + (day === 0 ? -6 : 1); 
              const startOfWeek = new Date(now); startOfWeek.setDate(diff); startOfWeek.setHours(0,0,0,0); 
              return date >= startOfWeek; 
            } 
            if (timeframe === 'monthly') return date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear(); 
            return true; 
          }); 
        }, [salesHistory, timeframe]);

        const stats = useMemo(() => { 
          const totalRevenue = filteredSales.reduce((sum, sale) => sum + sale.total, 0); 
          const totalOrders = filteredSales.length; 
          const itemCounts = {}; 
          filteredSales.forEach(sale => sale.items.forEach(i => itemCounts[i.name] = (itemCounts[i.name] || 0) + i.quantity)); 
          let popular = 'N/A'; let max = 0; 
          Object.entries(itemCounts).forEach(([name, count]) => { if (count > max) { max = count; popular = name; } }); 
          return { totalRevenue, totalOrders, popular }; 
        }, [filteredSales]);

        const chartData = useMemo(() => { 
          const dataMap = new Map(); 
          const now = new Date();

          if (timeframe === 'daily') { 
            for(let i=0; i<24; i++) dataMap.set(i.toString().padStart(2, '0') + ':00', 0);
            filteredSales.forEach(sale => { 
              const d = new Date(sale.timestamp); 
              const hour = d.getHours().toString().padStart(2, '0') + ':00'; 
              if(dataMap.has(hour)) dataMap.set(hour, dataMap.get(hour) + sale.total); 
            }); 
          } 
          else if (timeframe === 'weekly') {
            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            days.forEach(day => dataMap.set(day, 0));
            filteredSales.forEach(sale => {
              const d = new Date(sale.timestamp);
              const dayIndex = d.getDay();
              const adjustedIndex = dayIndex === 0 ? 6 : dayIndex - 1; 
              dataMap.set(days[adjustedIndex], dataMap.get(days[adjustedIndex]) + sale.total);
            });
          }
          else if (timeframe === 'monthly') {
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            for(let i=1; i<=lastDay; i++) dataMap.set(`Day ${i.toString().padStart(2, '0')}`, 0);
            filteredSales.forEach(sale => {
              const d = new Date(sale.timestamp);
              const dayKey = `Day ${d.getDate().toString().padStart(2, '0')}`;
              if(dataMap.has(dayKey)) dataMap.set(dayKey, dataMap.get(dayKey) + sale.total);
            });
          } 
          return Array.from(dataMap.entries()).map(([name, value]) => ({ name, value: convertPrice(value), originalValue: value })); 
        }, [filteredSales, timeframe, convertPrice]);

        return (
          <div className="h-full p-6 overflow-y-auto bg-slate-50 no-scrollbar">
            <header className="mb-6 flex justify-between items-center">
              <h1 className="text-2xl font-bold">Sales Dashboard</h1>
              <div className="flex bg-white rounded-lg p-1 border">
                {['daily', 'weekly', 'monthly'].map(t => (
                  <button key={t} onClick={() => setTimeframe(t)} className={`px-6 py-2 rounded-md text-sm font-bold capitalize transition-all ${timeframe === t ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}>{t}</button>
                ))}
              </div>
            </header>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
              <div className="bg-white p-6 rounded-2xl border flex items-center gap-4 shadow-sm">
                <div className="p-3 rounded-xl bg-emerald-50 text-emerald-600"><DollarSign size={24}/></div>
                <div><p className="text-slate-400 text-xs font-bold uppercase">Revenue</p><p className="text-2xl font-black">{formatPrice(stats.totalRevenue)}</p></div>
              </div>
              <div className="bg-white p-6 rounded-2xl border flex items-center gap-4 shadow-sm">
                <div className="p-3 rounded-xl bg-blue-50 text-blue-600"><ShoppingBag size={24}/></div>
                <div><p className="text-slate-400 text-xs font-bold uppercase">Orders</p><p className="text-2xl font-black">{stats.totalOrders}</p></div>
              </div>
              <div className="bg-white p-6 rounded-2xl border flex items-center gap-4 shadow-sm">
                <div className="p-3 rounded-xl bg-amber-50 text-amber-600"><Star size={24}/></div>
                <div><p className="text-slate-400 text-xs font-bold uppercase">Top Item</p><p className="text-2xl font-black truncate w-32">{stats.popular}</p></div>
              </div>
            </div>

            <div className="bg-white p-6 rounded-2xl border h-96 mb-8 shadow-sm">
              <h3 className="text-lg font-bold mb-6 text-slate-700">Revenue Trends</h3>
              <div className="w-full h-full pb-10">
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={chartData}><CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9"/><XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fontSize: 10}} interval={timeframe === 'monthly' ? 2 : 0}/><YAxis axisLine={false} tickLine={false} tick={{fontSize: 10}} /><Tooltip cursor={{fill: '#f1f5f9'}}/><Bar dataKey="value" fill="#10b981" radius={[4,4,0,0]}/></BarChart>
                </ResponsiveContainer>
              </div>
            </div>

            <div className="bg-white rounded-2xl border shadow-sm overflow-hidden mb-12">
              <div className="p-4 border-b bg-slate-50 font-bold text-slate-700">Detailed Breakdown</div>
              <table className="w-full text-left">
                <thead><tr className="text-[10px] uppercase text-slate-400 border-b"><th className="px-6 py-4 font-black">Time Period</th><th className="px-6 py-4 font-black text-right">Revenue</th></tr></thead>
                <tbody className="divide-y divide-slate-50">
                  {chartData.map((row, idx) => (
                    <tr key={idx} className="hover:bg-slate-50"><td className="px-6 py-4 text-sm font-bold text-slate-600">{row.name}</td><td className={`px-6 py-4 text-sm text-right font-black ${row.originalValue > 0 ? 'text-emerald-600' : 'text-slate-300'}`}>{formatPrice(row.originalValue)}</td></tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      };

      const StockPage = () => {
        const { stockItems, addStockItem, updateStockItem, deleteStockItem, categories } = useData();
        const [searchTerm, setSearchTerm] = useState('');
        const [selectedCategory, setSelectedCategory] = useState('All');

        const handleSubmit = (e) => { e.preventDefault(); if(editingItem) updateStockItem({ ...editingItem, ...formData }); else addStockItem(formData); setIsModalOpen(false); };
        return (

             <div className="bg-white p-4 rounded-xl border mb-6 flex flex-col gap-4">
                <input type="text" placeholder="Search..." className="w-full px-4 py-2 border rounded-lg" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                <div className="flex gap-2 overflow-x-auto no-scrollbar">{['All', ...categories].map(c => <button key={c} onClick={() => setSelectedCategory(c)} className={`px-3 py-1.5 rounded-lg text-sm ${selectedCategory === c ? 'bg-emerald-100 text-emerald-700' : 'bg-white border'}`}>{c}</button>)}</div>
             </div>
             <div className="bg-white border rounded-xl overflow-hidden shadow-sm">
                 <table className="w-full text-left text-sm">
                     <thead className="bg-slate-50 text-slate-500 border-b"><tr><th className="px-4 py-3 font-semibold">Item</th><th className="px-4 py-3 font-semibold">Stock</th><th className="px-4 py-3 font-semibold text-right">Actions</th></tr></thead>
                     <tbody className="divide-y">
                         {filteredStock.map(item => (
                             <tr key={item.id} className="hover:bg-slate-50"><td className="px-4 py-3 font-medium">{item.name}</td><td className="px-4 py-3 font-bold">{item.stock}</td>
                                 <td className="px-4 py-3 text-right flex justify-end gap-2"><button onClick={() => updateStockItem({...item, stock: item.stock + 1})} className="p-1 border rounded text-emerald-600"><Plus size={16}/></button><button onClick={() => openModal(item)} className="p-1 text-slate-400"><Edit2 size={16}/></button></td></tr>
                         ))}

             </div>
             {isModalOpen && (<div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"><div className="bg-white w-full max-w-md rounded-2xl p-6 shadow-xl"><form onSubmit={handleSubmit} className="space-y-4"><h3>{editingItem ? 'Edit' : 'Add'} Stock</h3><input type="text" className="w-full border p-2" placeholder="Name" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} /><input type="number" className="w-full border p-2" placeholder="Stock" value={formData.stock} onChange={e => setFormData({...formData, stock: parseInt(e.target.value)})} /><div className="flex justify-end gap-2"><button type="button" onClick={() => setIsModalOpen(false)}>Cancel</button><button type="submit" className="bg-emerald-600 text-white px-4 py-2 rounded">Save</button></div></form></div></div>)}

      const InventoryPage = () => {
        const { menuItems, stockItems, addMenuItem, updateMenuItem, deleteMenuItem, formatPrice, categories } = useData();

        const openLinkModal = (item) => { setLinkingItem(item); setTempRecipe(item.recipe || []); setIsLinkModalOpen(true); };
        const handleAddRecipeItem = () => { if(!linkStockId || linkQty <= 0) return; setTempRecipe([...tempRecipe, { itemId: linkStockId, quantity: linkQty }]); setLinkStockId(''); };
        const handleSaveRecipe = () => { if(!linkingItem) return; updateMenuItem({ ...linkingItem, recipe: tempRecipe }); setIsLinkModalOpen(false); };
        const handleSubmit = (e) => { e.preventDefault(); if(editingItem) updateMenuItem({ ...editingItem, ...formData }); else addMenuItem(formData); setIsModalOpen(false); };
        const addModifier = () => { if(!newModName) return; setFormData({ ...formData, modifiers: [...(formData.modifiers || []), { name: newModName, price: parseFloat(newModPrice) }] }); setNewModName(''); setNewModPrice(0); }
        const filteredMenu = menuItems.filter(i => i.name.toLowerCase().includes(searchTerm.toLowerCase()));
        return (
          <div className="h-full p-6 bg-slate-50 overflow-y-auto no-scrollbar">
             <header className="mb-6 flex justify-between items-center"><div><h1 className="text-2xl font-bold text-slate-900">Menu</h1></div><button onClick={() => openModal()} className="px-4 py-2 bg-emerald-600 text-white rounded-lg"><Plus size={18}/></button></header>
             <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                 {filteredMenu.map(item => (
                     <div key={item.id} className="bg-white p-4 rounded-xl border flex justify-between items-center">
                         <div className="min-w-0"><h3 className="font-bold truncate">{item.name}</h3><span className="text-xs text-slate-500 uppercase">{item.category}</span></div>
                         <div className="flex flex-col items-end gap-2"><span className="font-bold">{formatPrice(item.price)}</span>
                             <div className="flex gap-1"><button onClick={() => openLinkModal(item)} className="p-1 border rounded text-blue-600"><LinkIcon size={12}/></button><button onClick={() => openModal(item)} className="p-1 text-slate-400"><Edit2 size={16}/></button></div>
                         </div>
                     </div>
                 ))}
             </div>
             {isModalOpen && (<div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"><div className="bg-white w-full max-w-lg rounded-2xl shadow-xl p-6 overflow-y-auto max-h-[90vh]"><form onSubmit={handleSubmit} className="space-y-4"><h3>{editingItem ? 'Edit' : 'New'} Product</h3><input type="text" className="w-full border p-2" placeholder="Name" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} /><input type="number" className="w-full border p-2" placeholder="Price" value={formData.price} onChange={e => setFormData({...formData, price: parseFloat(e.target.value)})} /><select className="w-full border p-2" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})}>{categories.map(c => <option key={c} value={c}>{c}</option>)}</select>
                <div className="border-t pt-4"><b>Modifiers</b><div className="flex gap-2"><input type="text" className="flex-1 border p-1" placeholder="Name" value={newModName} onChange={e => setNewModName(e.target.value)} /><input type="number" className="w-20 border p-1" value={newModPrice} onChange={e => setNewModPrice(e.target.value)} /><button type="button" onClick={addModifier} className="bg-emerald-600 text-white p-1 rounded"><Plus size={16}/></button></div></div>
                <button type="submit" className="w-full bg-emerald-600 text-white py-2 rounded">Save</button></form></div></div>)}
             {isLinkModalOpen && (<div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"><div className="bg-white w-full max-w-md rounded-2xl p-6"><h3 className="font-bold mb-4">Recipe Link</h3>
                <div className="space-y-2 mb-4">{tempRecipe.map((ing, idx) => (<div key={idx} className="flex justify-between border-b pb-1"><span>{stockItems.find(s=>s.id===ing.itemId)?.name}</span><span>x{ing.quantity}</span></div>))}</div>
                <div className="flex gap-2"><select className="flex-1 border" value={linkStockId} onChange={e => setLinkStockId(e.target.value)}><option value="">Select...</option>{stockItems.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select><input type="number" className="w-16 border" value={linkQty} onChange={e => setLinkQty(parseFloat(e.target.value))} /><button onClick={handleAddRecipeItem} className="bg-emerald-600 text-white p-1 rounded"><Plus size={16}/></button></div>
                <div className="flex gap-2 mt-6"><button onClick={() => setIsLinkModalOpen(false)} className="flex-1">Cancel</button><button onClick={handleSaveRecipe} className="flex-1 bg-blue-600 text-white py-2 rounded">Save</button></div></div></div>)}
          </div>
        );
      };

      const App = () => {
        const [currentView, setCurrentView] = useState('tables');
        const [activeTicketId, setActiveTicketId] = useState(null);
        const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
        return (
          <DataProvider>
            <div className="flex h-full w-full bg-slate-50">
               <Sidebar currentView={currentView} setCurrentView={setCurrentView} isMobileMenuOpen={isMobileMenuOpen} setIsMobileMenuOpen={setIsMobileMenuOpen} />
               <main className="flex-1 h-full overflow-hidden relative no-scrollbar">
                 {currentView === 'tables' && <TablesPage setActiveTicketId={setActiveTicketId} setCurrentView={setCurrentView} />}
                 {currentView === 'pos' && <POSPage activeTicketId={activeTicketId} setActiveTicketId={setActiveTicketId} setCurrentView={setCurrentView} />}
                 {currentView === 'sales' && <SalesPage />}
                 {currentView === 'stock' && <StockPage />}
                 {currentView === 'inventory' && <InventoryPage />}
               </main>
            </div>
          </DataProvider>
        );
      };
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
