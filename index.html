<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LACASA POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }

      /* --- THERMAL PRINTER STYLES --- */
      @media screen { .print-only { display: none !important; } }

      @media print {
        @page { margin: 0; size: 80mm auto; }
        body * { visibility: hidden; }
        #root, body, html { overflow: visible !important; height: auto !important; background: white; }
        .print-only, .print-only * { visibility: visible !important; }
        .print-only { 
            position: absolute; left: 0; top: 0; width: 74mm; 
            padding: 4px; font-family: 'Courier New', monospace;
            font-size: 13px; color: black; display: block !important;
        }
        .receipt-line { display: flex; justify-content: space-between; width:100%; margin-bottom: 2px; }
        .receipt-divider { border-bottom: 1px dashed black; margin: 5px 0; }
        .receipt-header { text-align: center; margin-bottom: 10px; }
        .receipt-bold { font-weight: bold; }
        .receipt-large { font-size: 18px; font-weight: bold; }

        /* SUNFLOWER STEM STYLES */
        .receipt-stem-container {
          border-left: 2px dashed black; 
          margin-left: 10px;
          padding-left: 15px;
          position: relative;
          height: auto;
        }
        .flower-head { font-size: 40px; margin-left: -8px; line-height: 1; margin-bottom: -10px; }
        .stem-leaf { position: absolute; left: -22px; font-size: 18px; }
        .flower-root { font-size: 22px; margin-left: 2px; margin-top: -10px; }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
        "recharts": "https://esm.sh/recharts@2.12.2?external=react,react-dom",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      }
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 overflow-hidden">
    <div id="root" class="h-screen w-screen flex flex-col"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useContext, createContext, useMemo, useRef } from 'react';
      import ReactDOM from 'react-dom/client';
      import { 
        LayoutDashboard, ShoppingCart, Package, Coins, Plus, Minus, X, Search, 
        Edit2, Trash2, DollarSign, ShoppingBag, Star, ClipboardList, 
        AlertTriangle, Printer, FileText, User, Link as LinkIcon, Scissors, Armchair, Settings, LogOut, Loader2
      } from 'lucide-react';
      import { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } from 'recharts';
      import { initializeApp } from "firebase/app";
      import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";
      import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, getDocs, writeBatch, setDoc } from "firebase/firestore";

      const firebaseConfig = {
        apiKey: "AIzaSyDU9-o2lNfM0h1EZHjh2cZxluSddoP980Q",
        authDomain: "lacasa-ddc80.firebaseapp.com",
        projectId: "lacasa-ddc80",
        storageBucket: "lacasa-ddc80.firebasestorage.app",
        messagingSenderId: "162103724482",
        appId: "1:162103724482:web:55709c250858d273dd6e5b"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const EXCHANGE_RATE = 90000;

      // --- DATA PROVIDER ---
      const DataContext = createContext(undefined);
      const DataProvider = ({ children }) => {
        const [user, setUser] = useState(null);
        const [authLoading, setAuthLoading] = useState(true);
        const [currency, setCurrency] = useState('LBP');
        const [menuItems, setMenuItems] = useState([]);
        const [stockItems, setStockItems] = useState([]);
        const [tickets, setTickets] = useState([]);
        const [salesHistory, setSalesHistory] = useState([]);
        const [categories, setCategories] = useState([]);
        const [tableConfig, setTableConfig] = useState({ floor1: 10, floor2: 6 });

        useEffect(() => {
          const unsub = onAuthStateChanged(auth, u => { setUser(u); setAuthLoading(false); });
          return unsub;
        }, []);

        useEffect(() => {
          if (!user) return;
          const unsubMenu = onSnapshot(collection(db, 'menuItems'), s => setMenuItems(s.docs.map(d => ({id: d.id, ...d.data()}))));
          const unsubStock = onSnapshot(collection(db, 'stockItems'), s => setStockItems(s.docs.map(d => ({id: d.id, ...d.data()}))));
          const unsubSales = onSnapshot(query(collection(db, 'sales'), orderBy('timestamp', 'desc')), s => setSalesHistory(s.docs.map(d => ({id: d.id, ...d.data()}))));
          const unsubTickets = onSnapshot(query(collection(db, 'tickets'), orderBy('createdAt', 'asc')), s => setTickets(s.docs.map(d => ({id: d.id, ...d.data()}))));
          const unsubCats = onSnapshot(collection(db, 'categories'), s => setCategories(s.docs.map(d => d.data().name)));
          const unsubConfig = onSnapshot(doc(db, 'settings', 'tables'), d => { if(d.exists()) setTableConfig(d.data()); });
          return () => { unsubMenu(); unsubStock(); unsubSales(); unsubTickets(); unsubCats(); unsubConfig(); };
        }, [user]);

        const formatPrice = (amt) => currency === 'USD' ? `$${amt.toFixed(2)}` : `${(amt * EXCHANGE_RATE).toLocaleString()} L.L`;
        
        const completeTicket = async (ticketId, itemsToPay = null) => {
          const ticket = tickets.find(t => t.id === ticketId);
          if(!ticket) return;
          let paying = itemsToPay ? ticket.items.filter((_, i) => itemsToPay.includes(i)) : ticket.items;
          const total = paying.reduce((s, i) => s + (i.price * i.quantity), 0);
          const batch = writeBatch(db);
          batch.set(doc(collection(db, 'sales')), { ticketName: ticket.name, items: paying, total, timestamp: Date.now() });
          if(!itemsToPay || itemsToPay.length === ticket.items.length) batch.delete(doc(db, 'tickets', ticketId));
          else batch.update(doc(db, 'tickets', ticketId), { items: ticket.items.filter((_, i) => !itemsToPay.includes(i)) });
          await batch.commit();
        };

        if (authLoading) return <div className="h-screen flex items-center justify-center text-emerald-600"><Loader2 className="animate-spin w-10 h-10"/></div>;
        if (!user) return <LoginPage />;

        return (
          <DataContext.Provider value={{ 
            user, menuItems, stockItems, tickets, salesHistory, currency, categories, tableConfig,
            formatPrice, toggleCurrency: () => setCurrency(c => c === 'USD' ? 'LBP' : 'USD'),
            logout: () => signOut(auth),
            addMenuItem: (i) => addDoc(collection(db, 'menuItems'), i),
            updateMenuItem: (i) => updateDoc(doc(db, 'menuItems', i.id), i),
            deleteMenuItem: (id) => deleteDoc(doc(db, 'menuItems', id)),
            addStockItem: (i) => addDoc(collection(db, 'stockItems'), i),
            updateStockItem: (i) => updateDoc(doc(db, 'stockItems', i.id), i),
            createTicket: async (tableId) => {
              const ex = tickets.find(t => t.tableId === tableId);
              if(ex) return ex.id;
              const d = await addDoc(collection(db, 'tickets'), { name: `Table ${tableId}`, tableId, items: [], createdAt: Date.now(), note: '' });
              return d.id;
            },
            updateTicketItems: (id, items) => updateDoc(doc(db, 'tickets', id), { items }),
            updateTicketDetails: (id, ups) => updateDoc(doc(db, 'tickets', id), ups),
            completeTicket
          }}>{children}</DataContext.Provider>
        );
      };

      const useData = () => useContext(DataContext);

      // --- LOGIN PAGE ---
      const LoginPage = () => {
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const handleLogin = async (e) => { e.preventDefault(); try { await signInWithEmailAndPassword(auth, email, password); } catch (err) { alert("Invalid login"); } };
        return (
          <div className="h-screen flex items-center justify-center bg-slate-100">
            <form onSubmit={handleLogin} className="bg-white p-8 rounded-2xl shadow-xl w-80 space-y-4">
              <h2 className="text-2xl font-bold text-center">LACASA POS</h2>
              <input type="email" placeholder="Email" className="w-full border p-2 rounded" onChange={e => setEmail(e.target.value)} />
              <input type="password" placeholder="Password" className="w-full border p-2 rounded" onChange={e => setPassword(e.target.value)} />
              <button className="w-full bg-emerald-600 text-white py-2 rounded font-bold">Login</button>
            </form>
          </div>
        );
      };

      // --- TABLES PAGE ---
      const TablesPage = ({ setActiveTicketId, setCurrentView }) => {
        const { tickets, createTicket, formatPrice, tableConfig } = useData();
        const renderTable = (id) => {
          const t = tickets.find(t => t.tableId === id);
          return (
            <button key={id} onClick={async () => { const tid = await createTicket(id); setActiveTicketId(tid); setCurrentView('pos'); }} 
              className={`h-24 rounded-xl border-2 flex flex-col items-center justify-center ${t ? 'bg-red-50 border-red-200 text-red-700' : 'bg-white border-slate-100'}`}>
              <span className="text-xl font-bold">T{id}</span>
              {t && <span className="text-xs font-bold">{formatPrice(t.items.reduce((s,i) => s + i.price*i.quantity, 0))}</span>}
            </button>
          );
        };
        return (
          <div className="p-6 h-full overflow-y-auto no-scrollbar">
            <h1 className="text-2xl font-bold mb-6">Tables</h1>
            <div className="grid grid-cols-3 sm:grid-cols-5 gap-4">
              {Array.from({length: tableConfig.floor1 + tableConfig.floor2}, (_, i) => renderTable(i+1))}
            </div>
          </div>
        );
      };

      // --- POS PAGE ---
      const POSPage = ({ activeTicketId, setCurrentView }) => {
        const { menuItems, tickets, updateTicketItems, completeTicket, formatPrice, categories, updateTicketDetails } = useData();
        const [printMode, setPrintMode] = useState('receipt');
        const [showNote, setShowNote] = useState(false);
        const activeTicket = tickets.find(t => t.id === activeTicketId);

        if(!activeTicket) return <div className="p-20 text-center"><button onClick={() => setCurrentView('tables')} className="bg-emerald-600 text-white px-6 py-2 rounded">Select a Table</button></div>;

        const addItem = (item) => {
          const idx = activeTicket.items.findIndex(i => i.id === item.id);
          if(idx > -1) {
            const ups = [...activeTicket.items];
            ups[idx].quantity += 1;
            updateTicketItems(activeTicket.id, ups);
          } else {
            updateTicketItems(activeTicket.id, [...activeTicket.items, { ...item, quantity: 1, ticketItemId: Date.now() }]);
          }
        };

        const handleKitchenPrint = () => { setPrintMode('kitchen'); setTimeout(() => { window.print(); }, 50); };
        const handlePayPrint = () => { setPrintMode('receipt'); setTimeout(() => { window.print(); completeTicket(activeTicket.id); setCurrentView('tables'); }, 50); };

        const total = activeTicket.items.reduce((s, i) => s + (i.price * i.quantity), 0);

        return (
          <div className="flex h-full relative">
            <div className="flex-1 p-4 overflow-y-auto no-scrollbar pb-24 md:pb-4">
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                {menuItems.map(item => (
                  <button key={item.id} onClick={() => addItem(item)} className="bg-white p-4 rounded-xl border text-left flex flex-col justify-between h-32 hover:border-emerald-500">
                    <span className="font-bold text-sm leading-tight">{item.name}</span>
                    <span className="text-emerald-600 font-bold">{formatPrice(item.price)}</span>
                  </button>
                ))}
              </div>
            </div>

            <div className="w-full md:w-80 lg:w-96 bg-white border-l flex flex-col h-full shadow-xl">
              <div className="p-4 bg-emerald-600 text-white font-bold">{activeTicket.name}</div>
              <div className="flex-1 overflow-y-auto p-2 no-scrollbar">
                {activeTicket.items.map((item, i) => (
                  <div key={i} className="flex justify-between items-center p-3 border-b border-slate-50">
                    <div className="flex-1"><div className="font-bold text-sm">{item.name}</div><div className="text-xs text-slate-400">x{item.quantity}</div></div>
                    <div className="font-bold text-sm">{formatPrice(item.price * item.quantity)}</div>
                  </div>
                ))}
              </div>
              <div className="p-4 border-t space-y-4">
                <div className="flex justify-between text-xl font-black"><span>Total</span><span className="text-emerald-600">{formatPrice(total)}</span></div>
                <div className="grid grid-cols-4 gap-2">
                   <button onClick={() => setShowNote(!showNote)} className="p-3 border rounded-xl"><FileText/></button>
                   <button onClick={handleKitchenPrint} className="p-3 border rounded-xl text-blue-600"><Printer/></button>
                   <button onClick={handlePayPrint} className="col-span-2 bg-emerald-600 text-white rounded-xl font-bold">Pay Full</button>
                </div>
                {showNote && <textarea className="w-full p-2 border rounded" placeholder="Kitchen Note..." value={activeTicket.note} onChange={e => updateTicketDetails(activeTicket.id, {note: e.target.value})} />}
              </div>
            </div>

            {/* --- PRINT AREA --- */}
            <div id="printable-receipt" className="print-only">
              {printMode === 'kitchen' ? (
                <div>
                  <div className="receipt-header">
                    <div className="receipt-large">KITCHEN ORDER</div>
                    <div className="receipt-bold" style={{fontSize: '28px', margin: '5px 0'}}>TABLE: {activeTicket.name.replace('Table ', '')}</div>
                    <div className="receipt-divider"></div>
                  </div>
                  {activeTicket.items.filter(item => item.category?.toLowerCase() === 'food' || item.category?.toLowerCase() === 'dessert').map((item, i) => (
                    <div key={i} className="receipt-line receipt-bold" style={{fontSize: '20px'}}><span>{item.quantity} x {item.name}</span></div>
                  ))}
                  {activeTicket.note && (
                    <div style={{marginTop: '15px', padding: '10px', border: '3px solid black'}}>
                      <div className="receipt-bold" style={{fontSize: '18px'}}>NOTE:</div>
                      <div style={{fontSize: '20px', fontWeight: 'bold'}}>{activeTicket.note}</div>
                    </div>
                  )}
                </div>
              ) : (
                <div style={{padding: '5px'}}>
                  <div className="flower-head">🌻</div>
                  <div className="receipt-stem-container">
                    <div className="receipt-header" style={{textAlign: 'left'}}>
                      <div className="receipt-large" style={{fontSize: '24px'}}>LACASA</div>
                      <div style={{fontSize: '10px', letterSpacing: '2px'}}>LOUNGE & CAFE</div>
                    </div>
                    <div className="receipt-line" style={{fontSize: '10px'}}>
                      <span>{new Date().toLocaleDateString()} {new Date().toLocaleTimeString()}</span>
                      <span>Table: {activeTicket.name.replace('Table ', '')}</span>
                    </div>
                    <div className="receipt-divider"></div>
                    {activeTicket.items.map((item, i) => (
                      <div key={i} style={{marginBottom: '8px', position: 'relative'}}>
                        {(i === 0 || i === 3 || i === 6) && <span className="stem-leaf">🍃</span>}
                        <div className="receipt-line">
                          <span className="receipt-bold">{item.quantity} x {item.name}</span>
                          <span>{formatPrice(item.price * item.quantity)}</span>
                        </div>
                      </div>
                    ))}
                    <div className="receipt-divider"></div>
                    <div className="receipt-line receipt-large"><span>TOTAL</span><span>{formatPrice(total)}</span></div>
                    <div style={{marginTop: '20px', textAlign: 'center', paddingRight: '20px'}}>
                      <div className="receipt-bold">Thank You!</div>
                      <div style={{fontSize: '10px'}}>Visit us again</div>
                    </div>
                  </div>
                  <div className="flower-root">🌱</div>
                </div>
              )}
            </div>
          </div>
        );
      };

      // --- SALES PAGE ---
      const SalesPage = () => {
        const { salesHistory, formatPrice } = useData();
        const [timeframe, setTimeframe] = useState('daily');
        const now = new Date();

        const dataMap = useMemo(() => {
          const map = new Map();
          if (timeframe === 'daily') {
            for(let i=0; i<24; i++) map.set(i.toString().padStart(2, '0') + ':00', 0);
            salesHistory.filter(s => new Date(s.timestamp).toDateString() === now.toDateString())
              .forEach(s => { const h = new Date(s.timestamp).getHours().toString().padStart(2, '0') + ':00'; map.set(h, map.get(h) + s.total); });
          } else if (timeframe === 'weekly') {
            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            days.forEach(d => map.set(d, 0));
            salesHistory.forEach(s => { 
              const d = new Date(s.timestamp);
              const idx = d.getDay() === 0 ? 6 : d.getDay() - 1;
              map.set(days[idx], map.get(days[idx]) + s.total);
            });
          } else {
            const last = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            for(let i=1; i<=last; i++) map.set(`Day ${i.toString().padStart(2, '0')}`, 0);
            salesHistory.filter(s => new Date(s.timestamp).getMonth() === now.getMonth())
              .forEach(s => { const k = `Day ${new Date(s.timestamp).getDate().toString().padStart(2, '0')}`; if(map.has(k)) map.set(k, map.get(k) + s.total); });
          }
          return Array.from(map.entries()).map(([name, value]) => ({ name, value }));
        }, [salesHistory, timeframe]);

        return (
          <div className="p-6 h-full overflow-y-auto no-scrollbar bg-slate-50">
            <div className="flex justify-between items-center mb-8">
              <h1 className="text-2xl font-bold">Sales Dashboard</h1>
              <div className="flex bg-white border rounded-lg p-1">
                {['daily', 'weekly', 'monthly'].map(t => (
                  <button key={t} onClick={() => setTimeframe(t)} className={`px-4 py-1.5 rounded-md text-sm font-bold capitalize ${timeframe === t ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}>{t}</button>
                ))}
              </div>
            </div>
            
            <div className="bg-white p-6 rounded-2xl border shadow-sm mb-8 h-80">
               <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={dataMap}><CartesianGrid strokeDasharray="3 3" vertical={false}/><XAxis dataKey="name" tick={{fontSize: 10}} interval={timeframe==='monthly'?2:0}/><YAxis tick={{fontSize: 10}}/><Tooltip/><Bar dataKey="value" fill="#10b981" radius={[4,4,0,0]}/></BarChart>
               </ResponsiveContainer>
            </div>

            <div className="bg-white rounded-2xl border shadow-sm overflow-hidden mb-10">
              <div className="p-4 border-b bg-slate-50 font-bold">Detailed Breakdown</div>
              <table className="w-full text-left">
                <thead><tr className="text-[10px] text-slate-400 border-b uppercase font-black"><th className="px-6 py-4">Period</th><th className="px-6 py-4 text-right">Revenue</th></tr></thead>
                <tbody className="divide-y divide-slate-50">
                  {dataMap.map((row, i) => (
                    <tr key={i} className="hover:bg-slate-50">
                      <td className="px-6 py-4 text-sm font-bold text-slate-600">{row.name}</td>
                      <td className={`px-6 py-4 text-sm text-right font-black ${row.value > 0 ? 'text-emerald-600' : 'text-slate-300'}`}>{formatPrice(row.value)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      };

      // --- CRUDS (STOCK / INVENTORY) ---
      const StockPage = () => {
        const { stockItems, updateStockItem, formatPrice } = useData();
        return (
          <div className="p-6 h-full overflow-y-auto no-scrollbar">
            <h1 className="text-2xl font-bold mb-6">Stock</h1>
            <div className="bg-white border rounded-xl overflow-hidden shadow-sm">
              <table className="w-full text-left">
                <thead className="bg-slate-50 border-b text-slate-500"><tr><th className="px-4 py-3">Item</th><th className="px-4 py-3">Stock</th><th className="px-4 py-3">Actions</th></tr></thead>
                <tbody className="divide-y">
                  {stockItems.map(item => (
                    <tr key={item.id}>
                      <td className="px-4 py-3 font-medium">{item.name}</td>
                      <td className="px-4 py-3 font-black text-lg">{item.stock}</td>
                      <td className="px-4 py-3 flex gap-2"><button onClick={() => updateStockItem({...item, stock: item.stock + 1})} className="p-1 border rounded"><Plus size={16}/></button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      };

      const InventoryPage = () => {
        const { menuItems, addMenuItem, formatPrice, categories } = useData();
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [formData, setFormData] = useState({ name: '', price: 0, category: 'Food' });
        const handleSubmit = (e) => { e.preventDefault(); addMenuItem(formData); setIsModalOpen(false); };
        return (
          <div className="p-6 h-full overflow-y-auto no-scrollbar">
            <div className="flex justify-between items-center mb-6"><h1 className="text-2xl font-bold">Menu Items</h1><button onClick={() => setIsModalOpen(true)} className="bg-emerald-600 text-white px-4 py-2 rounded font-bold">Add Item</button></div>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {menuItems.map(item => (
                <div key={item.id} className="bg-white p-4 rounded-xl border flex justify-between items-center shadow-sm">
                  <div><h3 className="font-bold">{item.name}</h3><p className="text-xs text-slate-400 uppercase">{item.category}</p></div>
                  <span className="font-bold text-emerald-600">{formatPrice(item.price)}</span>
                </div>
              ))}
            </div>
            {isModalOpen && (<div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleSubmit} className="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md space-y-4">
                <h3 className="text-lg font-bold">New Menu Item</h3>
                <input type="text" placeholder="Name" className="w-full border p-2 rounded" onChange={e => setFormData({...formData, name: e.target.value})} />
                <input type="number" placeholder="Price (USD)" className="w-full border p-2 rounded" onChange={e => setFormData({...formData, price: parseFloat(e.target.value)})} />
                <select className="w-full border p-2 rounded" onChange={e => setFormData({...formData, category: e.target.value})}>
                  <option value="Food">Food</option><option value="Dessert">Dessert</option><option value="Drinks">Drinks</option>
                </select>
                <div className="flex gap-2"><button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 p-2 border rounded">Cancel</button><button type="submit" className="flex-1 p-2 bg-emerald-600 text-white rounded font-bold">Save</button></div>
              </form>
            </div>)}
          </div>
        );
      };

      // --- APP ROOT ---
      const App = () => {
        const [currentView, setCurrentView] = useState('tables');
        const [activeTicketId, setActiveTicketId] = useState(null);
        const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
        return (
          <DataProvider>
            <div className="flex h-full w-full bg-slate-50">
               <Sidebar currentView={currentView} setCurrentView={setCurrentView} isMobileMenuOpen={isMobileMenuOpen} setIsMobileMenuOpen={setIsMobileMenuOpen} />
               <main className="flex-1 h-full overflow-hidden relative no-scrollbar">
                 {currentView === 'tables' && <TablesPage setActiveTicketId={setActiveTicketId} setCurrentView={setCurrentView} />}
                 {currentView === 'pos' && <POSPage activeTicketId={activeTicketId} setCurrentView={setCurrentView} />}
                 {currentView === 'sales' && <SalesPage />}
                 {currentView === 'stock' && <StockPage />}
                 {currentView === 'inventory' && <InventoryPage />}
               </main>
            </div>
          </DataProvider>
        );
      };
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
